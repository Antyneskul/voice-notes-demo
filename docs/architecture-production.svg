  <rect width="1150" height="985" fill="#ffffff" />
  <text x="30" y="46" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start" class="t">Proposed production architecture</text>
  <line x1="30" y1="84" x2="74" y2="84" stroke="#2563eb" stroke-width="4" />
  <text x="86" y="90" font-size="17" fill="#2563eb" font-weight="700" text-anchor="start" class="t">Capture and upload</text>
  <line x1="330" y1="84" x2="374" y2="84" stroke="#15803d" stroke-width="4" />
  <text x="386" y="90" font-size="17" fill="#15803d" font-weight="700" text-anchor="start" class="t">Process and review</text>
  <line x1="630" y1="84" x2="674" y2="84" stroke="#c2410c" stroke-width="4" />
  <text x="686" y="90" font-size="17" fill="#c2410c" font-weight="700" text-anchor="start" class="t">Approve and export</text>
  <rect x="30" y="130" width="190" height="130" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="125.0" y="159" font-size="20" fill="#0f172a" font-weight="700" text-anchor="middle" class="t">Expo app</text>
  <text x="125.0" y="184" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">React Native</text>
  <text x="125.0" y="205" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">expo-audio</text>
  <text x="125.0" y="226" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">persistent audio files</text>
  <text x="125.0" y="247" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">SQLite upload state</text>
  <rect x="470" y="130" width="230" height="130" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="585.0" y="159" font-size="20" fill="#0f172a" font-weight="700" text-anchor="middle" class="t">Go/Gin API</text>
  <text x="585.0" y="184" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">ECS Fargate</text>
  <text x="585.0" y="205" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">notes · review · export</text>
  <text x="585.0" y="226" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">authenticated HTTPS</text>
  <rect x="470" y="350" width="230" height="120" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2" />
  <text x="585.0" y="379" font-size="20" fill="#0f172a" font-weight="700" text-anchor="middle" class="t">PostgreSQL</text>
  <text x="585.0" y="404" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">RDS</text>
  <text x="585.0" y="425" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">notes · leased jobs</text>
  <text x="585.0" y="446" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">results · export status</text>
  <rect x="470" y="550" width="230" height="185" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="585.0" y="579" font-size="20" fill="#0f172a" font-weight="700" text-anchor="middle" class="t">Go worker</text>
  <text x="585.0" y="604" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">ECS Fargate</text>
  <text x="585.0" y="625" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">reads audio from S3,</text>
  <text x="585.0" y="646" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">transcribes, extracts,</text>
  <text x="585.0" y="667" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">writes to the CRM,</text>
  <text x="585.0" y="688" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">records export status,</text>
  <text x="585.0" y="709" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">retries transient failures</text>
  <rect x="30" y="580" width="190" height="80" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2" />
  <text x="125.0" y="609" font-size="20" fill="#0f172a" font-weight="700" text-anchor="middle" class="t">Amazon S3</text>
  <text x="125.0" y="634" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">audio objects</text>
  <rect x="265" y="825" width="230" height="125" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" />
  <text x="380.0" y="854" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle" class="t">Managed AI services</text>
  <text x="380.0" y="879" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">speech-to-text</text>
  <text x="380.0" y="900" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">then extraction LLM</text>
  <text x="380.0" y="921" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">schema-constrained JSON</text>
  <rect x="550" y="825" width="200" height="100" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" />
  <text x="650.0" y="854" font-size="20" fill="#0f172a" font-weight="700" text-anchor="middle" class="t">Tenant CRM API</text>
  <text x="650.0" y="879" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">server-side adapter</text>
  <text x="650.0" y="900" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">over HTTPS</text>
  <rect x="890" y="130" width="230" height="130" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <text x="1005.0" y="159" font-size="20" fill="#0f172a" font-weight="700" text-anchor="middle" class="t">Admin and support</text>
  <text x="1005.0" y="184" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">Tenant setup and CRM access</text>
  <text x="1005.0" y="205" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">Job status and failures</text>
  <text x="1005.0" y="226" font-size="15" fill="#475569" font-weight="400" text-anchor="middle" class="t">Export recovery</text>
  <polyline points="222,163 468,163" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#m-2563eb)" marker-start="url(#m-2563eb-s)" />
  <text x="345" y="153" font-size="16" fill="#2563eb" font-weight="600" text-anchor="middle" class="t">1  create note  ⇄  upload URL</text>
  <text x="345" y="183" font-size="16" fill="#2563eb" font-weight="600" text-anchor="middle" class="t">2  confirm upload</text>
  <polyline points="125,260 125,578" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#m-2563eb)" />
  <text x="137" y="420" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start" class="t">2  upload audio directly</text>
  <text x="137" y="442" font-size="16" fill="#2563eb" font-weight="600" text-anchor="start" class="t">(presigned URL)</text>
  <polyline points="520,260 520,348" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" marker-end="url(#m-2563eb)" />
  <text x="510" y="297" font-size="15" fill="#2563eb" font-weight="600" text-anchor="end" class="t">1  note metadata</text>
  <text x="510" y="320" font-size="15" fill="#2563eb" font-weight="600" text-anchor="end" class="t">2  queued + job (1 txn)</text>
  <polyline points="220,218 468,218" fill="none" stroke="#15803d" stroke-width="3" stroke-linejoin="round" marker-end="url(#m-15803d)" />
  <text x="345" y="206" font-size="16" fill="#15803d" font-weight="600" text-anchor="middle" class="t">3  poll status · review · edit</text>
  <polyline points="700,580 800,580 800,445 702,445" fill="none" stroke="#15803d" stroke-width="3" stroke-linejoin="round" marker-end="url(#m-15803d)" />
  <text x="812" y="477" font-size="15" fill="#15803d" font-weight="600" text-anchor="start" class="t">3  save</text>
  <text x="812" y="497" font-size="15" fill="#15803d" font-weight="600" text-anchor="start" class="t">transcript</text>
  <text x="812" y="517" font-size="15" fill="#15803d" font-weight="600" text-anchor="start" class="t">+ draft</text>
  <polyline points="470,620 222,620" fill="none" stroke="#15803d" stroke-width="3" stroke-linejoin="round" marker-end="url(#m-15803d)" />
  <text x="345" y="609" font-size="16" fill="#15803d" font-weight="600" text-anchor="middle" class="t">3  read audio</text>
  <polyline points="470,695 380,695 380,823" fill="none" stroke="#15803d" stroke-width="3" stroke-linejoin="round" marker-end="url(#m-15803d)" />
  <text x="392" y="773" font-size="15" fill="#15803d" font-weight="600" text-anchor="start" class="t">3  transcribe,</text>
  <text x="392" y="795" font-size="15" fill="#15803d" font-weight="600" text-anchor="start" class="t">then extract</text>
  <polyline points="220,240 468,240" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" marker-end="url(#m-c2410c)" />
  <text x="345" y="260" font-size="16" fill="#c2410c" font-weight="600" text-anchor="middle" class="t">4  approve</text>
  <polyline points="650,260 650,348" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" marker-end="url(#m-c2410c)" />
  <text x="662" y="297" font-size="15" fill="#c2410c" font-weight="600" text-anchor="start" class="t">4  reviewed version</text>
  <text x="662" y="320" font-size="15" fill="#c2410c" font-weight="600" text-anchor="start" class="t">+ export job</text>
  <polyline points="700,640 930,640 930,395 702,395" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" marker-end="url(#m-c2410c)" />
  <text x="920" y="555" font-size="15" fill="#c2410c" font-weight="600" text-anchor="end" class="t">4  export status</text>
  <polyline points="650,735 650,823" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" marker-end="url(#m-c2410c)" />
  <text x="662" y="785" font-size="15" fill="#c2410c" font-weight="600" text-anchor="start" class="t">4  write approved note</text>
  <polyline points="520,550 520,472" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#m-15803d)" />
  <text x="510" y="505" fill="#15803d" font-size="15" font-weight="600" text-anchor="end" class="t">3  claim extraction job</text>
  <polyline points="650,550 650,472" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#m-c2410c)" />
  <text x="662" y="505" fill="#c2410c" font-size="15" font-weight="600" text-anchor="start" class="t">4  claim export job</text>
  <polyline points="702,195 888,195" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round" marker-end="url(#m-64748b)" marker-start="url(#m-64748b-s)" />
  <text x="795" y="185" font-size="16" fill="#475569" font-weight="600" text-anchor="middle" class="t">Authenticated HTTPS</text>
  <text x="795" y="219" font-size="15" fill="#475569" font-weight="600" text-anchor="middle" class="t">role-based and</text>
  <text x="795" y="240" font-size="15" fill="#475569" font-weight="600" text-anchor="middle" class="t">tenant-scoped</text>
</svg>