      <path d="M1,1 L11,6 L1,11 z" fill="#15803d" />
    </marker>
    <marker id="m-15803d-s" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#15803d" />
    </marker>
    <marker id="m-c2410c" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#c2410c" />
    </marker>
    <marker id="m-c2410c-s" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#c2410c" />
    </marker>
    <marker id="m-64748b" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#64748b" />
    </marker>
    <marker id="m-64748b-s" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#64748b" />
    </marker>
