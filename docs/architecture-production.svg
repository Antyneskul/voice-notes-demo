<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="985" viewBox="0 0 1150 985" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Proposed production architecture</title>
  <style>.t{paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}</style>
  <defs>
    <marker id="m-2563eb" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#2563eb" />
